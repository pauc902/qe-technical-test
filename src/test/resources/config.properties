# Default settings. Any key can be overridden on the command line (-Dkey=value)
# or with an environment variable (key in upper case, dots as underscores, e.g. ORANGEHRM_PASSWORD).
petstore.baseUrl=https://petstore.swagger.io/v2/
orangehrm.baseUrl=https://opensource-demo.orangehrmlive.com
# Public demo credentials, shown on the OrangeHRM login page itself.
orangehrm.username=Admin
orangehrm.password=admin123
# Run the browser without a visible window. Use -Dui.headless=false to watch it.
ui.headless=true
ui.browser=chromium
ui.timeoutMs=15000
# Pause (ms) between browser actions. 0 normally; about 500 makes a live demo easy to follow.
ui.slowMoMs=0
